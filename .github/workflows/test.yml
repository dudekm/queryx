name: Test

on:
  # Run when a pull request targeting main is opened or updated.
  pull_request:
    branches: [ main ]
  # Run on main only when something is merged (i.e. a push lands on main).
  # No tag triggers here, so tagging a version never runs the test suite.
  push:
    branches: [ main ]

# Avoid duplicate/overlapping runs: a push to a feature branch fires only the
# pull_request event (push is scoped to main), and a merge to main fires only
# the push event (the PR closes without a test-triggering pull_request type).
# This also cancels superseded in-progress runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every job's real result instead of cancelling the matrix on the
      # first failure.
      fail-fast: false
      matrix:
        # Test on the latest Go across all three OSes. `stable` auto-tracks the
        # newest released Go, so there are no version numbers to bump here.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run tests
      shell: bash
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.txt
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: true

#    - name: golangci-lint
#      uses: golangci/golangci-lint-action@v4
#      with:
#        version: latest
#        args: --timeout=5m

  build:
    name: Build CLI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: true

    - name: Build CLI (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        go build -o queryx ./cmd/queryx
        ./queryx -version

    - name: Build CLI (Windows)
      if: runner.os == 'Windows'
      run: |
        go build -o queryx.exe ./cmd/queryx
        .\queryx.exe -version
