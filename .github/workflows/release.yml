name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Run tests
      run: go test -v ./...

    - name: Build binaries
      run: |
        # Linux amd64
        GOOS=linux GOARCH=amd64 go build -o queryx-linux-amd64 ./cmd/queryx

        # Linux arm64
        GOOS=linux GOARCH=arm64 go build -o queryx-linux-arm64 ./cmd/queryx

        # Windows amd64
        GOOS=windows GOARCH=amd64 go build -o queryx-windows-amd64.exe ./cmd/queryx

        # macOS amd64
        GOOS=darwin GOARCH=amd64 go build -o queryx-darwin-amd64 ./cmd/queryx

        # macOS arm64
        GOOS=darwin GOARCH=arm64 go build -o queryx-darwin-arm64 ./cmd/queryx

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          queryx-linux-amd64
          queryx-linux-arm64
          queryx-windows-amd64.exe
          queryx-darwin-amd64
          queryx-darwin-arm64
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
