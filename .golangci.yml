run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gocritic
    - misspell
    - revive
    - gocyclo
    - dupl

linters-settings:
  gocyclo:
    min-complexity: 25  # Increased to allow complex parsers
  dupl:
    threshold: 100
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - paramTypeCombine
      - unnamedResult
      - appendAssign
  revive:
    rules:
      - name: var-naming
        disabled: true
  errcheck:
    exclude-functions:
      # bytes.Buffer operations never fail
      - (*bytes.Buffer).Write
      - (*bytes.Buffer).WriteByte
      - (*bytes.Buffer).WriteString

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - dupl
        - gocritic
        - errcheck
    # Exclude mock files
    - path: mock\.go
      linters:
        - unused
        - deadcode
    # Exclude bytes.Buffer operations (they never fail)
    - text: "Error return value.*bytes.Buffer.*Write"
      linters:
        - errcheck
    # Exclude ineffassign for shadowed variables
    - text: "ineffectual assignment"
      linters:
        - ineffassign
  max-same-issues: 0
  max-issues-per-linter: 0
